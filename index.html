<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100vh}.app{max-width:720px;margin:auto;padding:0 14px calc(88px + env(safe-area-inset-bottom))}.hidden{display:none!important}.muted{color:var(--muted)}.tiny{font-size:calc(11px * var(--font-scale))}.small{font-size:calc(13px * var(--font-scale))}.money{font-variant-numeric:tabular-nums}.top{padding:13px 0 8px}.profilebar{display:flex;align-items:center;justify-content:space-between;gap:10px}.profile{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--text);padding:0;text-align:left}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid #3c6a86;background:#17354a}.hello{font-size:calc(17px * var(--font-scale));font-weight:700}.hello span{color:#7fc0ff}.topactions{display:flex;gap:8px}.round{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#102b3f;color:#fff;font-size:calc(23px * var(--font-scale))}.plus{background:var(--blue);border-color:#3ea0ff;font-size:calc(29px * var(--font-scale))}.calendar{margin-top:11px;padding:11px 4px 3px}.monthrow{display:flex;justify-content:space-between;align-items:center}.monthrow button{border:0;background:none;color:#d9e7f1;font-size:calc(22px * var(--font-scale))}.month{font-weight:700;font-size:calc(16px * var(--font-scale))}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:7px}.daycell{text-align:center;color:#8299a9;font-size:calc(10px * var(--font-scale))}.daycell b{display:grid;place-items:center;height:34px;margin-top:4px;border-radius:11px;color:#eaf3f8;font-size:calc(13px * var(--font-scale))}.daycell.active b{background:var(--blue);color:#fff;box-shadow:0 4px 14px #1787ff55}.sectiontitle{display:flex;justify-content:space-between;align-items:center;margin:7px 3px 9px}.sectiontitle h1,.sectiontitle h2{margin:0;font-size:calc(24px x;display:flex;align-items:center;gap:11px}.logo{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-weight:900;font-size:calc(16px * var(--font-scale));background:#3c18a8;color:white;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}.grow{flex:1;min-width:0}.right{text-align:right}.yield{color:var(--green);font-weight:800}.nav{position:fixed;left:50%;right:auto;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(380px,calc(100% - 36px));z-index:40;background:rgba(14,35,51,.68);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid rgba(125,177,211,.28);border-radius:30px;padding:5px;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 10px 30px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.08)}.nav button{border:0;background:transparent;color:#9aafbd;border-radius:23px;padding:7px 2px;font-size:calc(11px * var(--font-scale));min-height:58px}.nav button.active{background:rgba(23,135,255,.24);color:#54adff;font-weight:800;box-shadow:inset 0 0 0 1px rgba(63,161,255,.65),0 4px 16px rgba(23,135,255,.18)}.nav .ico{display:block;font-size:calc(19px * var(--font-scale));margin-bottom:2px}.screen{padding-top:13px}.screenhead{display:flex;align-items:center;gap:9px;margin-bottom:10px}.screenhead h1{font-size:calc(26px * var(--font-scale));margin:0}.back{border:0;background:#102c40;color:#fff;border-radius:12px;width:40px;height:40px;font-size:calc(21px * var(--font-scale))}.tabs{display:flex;background:#0d2232;border:1px solid var(--line);border-radius:13px;padding:3px;margin:8px 0 11px}.tabs button{flex:1;border:0;background:none;color:#9db0bf;padding:10px;border-radius:10px;font-weight:700}.tabs button.active{background:#176eb9;color:#fff}.fab{position:fixed;right:18px;bottom:calc(94px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:calc(29px * var(--font-scale));box-shadow:0 8px 22px #1787ff55;z-index:35}.detailHero{padding:16px}.detailHero .big{font-size:calc(30px * var(--font-scale));font-weight:850}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.detailBox{background:#0c1e2c;border:1px solid var(--line);border-radius:14px;padding:12px}.detailBox .v{font-size:calc(18px * var(--font-scale));font-weight:800;margin-top:3px}.item{padding:13px}.itemhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.itemhead strong{font-size:calc(16px * var(--font-scale))}.chip{background:#17344a;color:#b8d1e2;border-radius:999px;padding:5px 8px;font-size:calc(11px * var(--font-scale))}.form{display:grid;gap:11px}.field label{display:block;color:#9db0bf;font-size:calc(12px * var(--font-scale));margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#0b1d2b;color:#fff;padding:12px;font-size:calc(16px * var(--font-scale));outline:none}.field textarea{min-height:90px}.btns{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800}.primary{background:var(--blue);color:#fff}.secondary{background:#17354a;color:#dceaf3}.danger{background:#4a1820;color:#ff9aa4}.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menuAction{border:1px solid var(--line);background:#10283a;color:#fff;border-radius:16px;padding:14px;text-align:left}.menuAction .mi{font-size:calc(23px * var(--font-scale))}.sheetback{position:fixed;inset:0;background:#0009;z-index:70;display:flex;align-items:flex-end}.sheet{width:100%;max-height:90vh;overflow:auto;background:#0a1a27;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:16px 14px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px #000b}.sheettop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.sheet h2{margin:0;font-size:calc(21px * var(--font-scale))}.close{border:0;background:#173249;color:#fff;border-radius:50%;width:36px;height:36px;font-size:calc(20px * var(--font-scale))}.profileMenu{display:grid;gap:0}.profileTop{display:flex;align-items:center;gap:10px;padding:6px 2px 13px}.profileTop img{width:56px;height:56px;border-radius:50%;object-fit:cover}.profileMenu button{width:100%;border:0;border-top:1px solid var(--line);background:none;color:#fff;text-align:left;padding:13px 5px;font-size:calc(15px * var(--font-scale));display:flex;gap:10px;align-items:center}.profileMenu button:last-child{color:#ff6573}.settingsSection{padding:14px;margin-top:10px}.settingsSection h3{margin:0 0 9px;font-size:calc(16px * var(--font-scale))}.settingRow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);gap:10px}.switch{width:45px;height:26px;border-radius:99px;background:#3b4c59;position:relative;border:0}.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:var(--blue)}.switch.on i{left:22px}.colors{display:flex;gap:9px}.swatch{width:29px;height:29px;border-radius:50%;border:2px solid #6d8391}.swatch.sel{outline:2px solid #fff;outline-offset:2px}.empty{padding:30px;text-align:center;color:#9db0bf}.notice{padding:11px 12px;border-radius:12px;background:#123149;color:#bdd2df;font-size:calc(12px * var(--font-scale));margin-top:9px}.filepick{display:flex;align-items:center;gap:10px}.filepick input{display:none}.thumb{width:54px;height:54px;border-radius:14px;object-fit:cover;background:#17354a;border:1px solid var(--line)}.settingRow select{max-width:58%;color:#fff;background:#17354a;border:1px solid var(--line);padding:8px 10px;border-radius:10px;font-size:calc(13px * var(--font-scale))}@media(max-width:380px){.app{padding-left:10px;padding-right:10px}.stats,.breakdown{gap:7px}.hero .net{font-size:calc(30px * var(--font-scale))}.nav{width:calc(100% - 20px)}.nav button{min-height:52px}.settingRow{align-items:flex-start;flex-wrap:wrap}.settingRow>select,.settingRow>.colors{margin-left:auto}}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#eaf4fb;color:#071521;padding:10px 15px;border-radius:999px;z-index:100;font-size:calc(13px * var(--font-scale));font-weight:800;box-shadow:0 7px 22px #0007}.hideBalances .money{color:transparent;text-shadow:0 0 8px #fff8}.history{max-height:320px;overflow:auto}.history .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.positive{color:var(--green)}.negative{color:#ff7582}
:root{--font-scale:1}

body{transition:background .2s,color .2s}
[data-theme="light"]{--bg:#f4f7fa;--panel:#ffffff;--panel2:#eef3f7;--line:#cbd8e2;--text:#10202b;--muted:#5f7483;--shadow:0 8px 24px rgba(24,55,75,.12)}
[data-theme="light"] .card{background:linear-gradient(145deg,#fff,#edf3f7)}

[data-theme="light"] .nav button{color:#617684}
[data-theme="light"] .nav button.active{background:rgba(23,135,255,.12);color:var(--blue)}

<body>
<div id="app"></div><div id="modal"></div>
<nav class="nav" id="nav"></nav>
<script>
const KEY='finanzas-final-draft-v1';
const defaultState={
 profile:{name:'Curita',avatar:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=160&q=80'},
 settings:{theme:'system',fontScale:'system',hide:false,autoBackup:true,color:'#1787ff'},
 banks:[],
 savings:[
  {id:1,name:'NU Ahorro',capital:25000,rate:13,yieldAccrued:1300,lastAccrual:'2026-09-27',limit:25000,logo:'NU',color:'#5b20d1',history:[]},
  {id:2,name:'Ahorro 15%',capital:50000,rate:15,yieldAccrued:500,lastAccrual:'2026-09-27',limit:null,logo:'15%',color:'#1678e8',history:[]},
  {id:3,name:'Ahorro 8%',capital:40000,rate:8,yieldAccrued:1000,lastAccrual:'2026-09-27',limit:null,logo:'8%',color:'#7be4c5',history:[]}
 ],
 cards:[
  {id:1,name:'BBVA Crédito',bank:'BBVA',kind:'credito',limit:10000,spent:7150,cut:'15 de cada mes',due:'30 de cada mes',logo:'BBVA',color:'#1769aa',movements:[]},
  {id:2,name:'Crédito NU',bank:'NU',kind:'credito',limit:7000,spent:0,cut:'17 de cada mes',due:'2 de cada mes',logo:'NU',color:'#5b20d1',movements:[]},
  {id:3,name:'Débito principal',bank:'BBVA',kind:'debito',balance:15000,logo:'BBVA',color:'#1769aa',movements:[]},
  {id:4,name:'Débito NU',bank:'NU',kind:'debito',balance:17850,logo:'NU',color:'#5b20d1',movements:[]}
 ],
 goals:[{id:1,name:'Mazda CX-30',target:100000,saved:50000,image:'https://images.unsplash.com/photo-1542362567-b07e54358753?auto=format&fit=crop&w=300&q=80'}],
 movements:[
  {id:1,date:'27/09/2026',type:'ingreso',desc:'Sueldo',amount:12700,from:'Empresa',to:'Cuenta de débito'},
  {id:2,date:'27/09/2026',type:'transferencia',desc:'Ahorro',amount:5000,from:'Débito',to:'NU Ahorro'},
  {id:3,date:'26/09/2026',type:'gasto',desc:'Supermercado',amount:850,from:'Débito',to:'Supermercado',category:'Alimentos'},
  {id:4,date:'25/09/2026',type:'rendimiento',desc:'Rendimiento NU',amount:8.9,from:'NU Ahorro',to:'Rendimiento'},
  {id:5,date:'24/09/2026',type:'pago_tarjeta',desc:'Pago tarjeta',amount:2000,from:'Débito',to:'BBVA Crédito'}
 ],
 expenses:[{id:1,category:'Vivienda',amount:3400},{id:2,category:'Alimentos',amount:2850},{id:3,category:'Transporte',amount:1900},{id:4,category:'Servicios',amount:1130},{id:5,category:'Compras',amount:1200},{id:6,category:'Otros',amount:2000}]
};
let state=load(); let view='inicio'; let sub='debito'; let selected=null; let calendarDate=new Date(2026,8,27);
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaultState)}catch{return structuredClone(defaultState)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state)); if(state.settings.autoBackup)localStorage.setItem(KEY+'-backup',JSON.stringify({version:2,savedAt:new Date().toISOString(),state}))}
function money(n){if(state.settings.hide)return '••••••';return Number(n||0).toLocaleString('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:2,maximumFractionDigits:2})}
function raw(n){return Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}
function daysBetween(a,b){const x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');return Math.max(0,Math.floor((y-x)/86400000))}
function accrue(){const today=new Date().toISOString().slice(0,10); let changed=false; state.savings.forEach(s=>{const days=daysBetween(s.lastAccrual||today,today);if(days>0){const daily=s.capital*(s.rate/100)/365;s.yieldAccrued+=daily*days;s.lastAccrual=today;s.history=s.history||[];s.history.unshift({date:today,amount:daily*days,rate:s.rate});changed=true}});if(changed)save()}
function totals(){const savings=state.savings.reduce((a,s)=>a+s.capital,0);const yields=state.savings.reduce((a,s)=>a+s.yieldAccrued,0);const debit=state.cards.filter(c=>c.kind==='debito').reduce((a,c)=>a+c.balance,0)+state.banks.reduce((a,b)=>a+b.balance,0);const debts=state.cards.filter(c=>c.kind==='credito').reduce((a,c)=>a+c.spent,0);return{ savings,yields,debit,debts,total:savings+yields+debit }}
function todayLabel(){return new Intl.DateTimeFormat('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(calendarDate)}
function nav(){const items=[['inicio','⌂','Inicio'],['ahorros','▣','Ahorros'],['tarjetas','▤','Tarjetas'],['gastos','▥','Gastos'],['movimientos','≋','Mov.']];document.getElementById('nav').innerHTML=items.map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')"><span class="ico">${x[1]}</span>${x[2]}</button>`).join('')}
function go(v){view=v;selected=null;render()}
function header(){return `<div class="top"><div class="profilebar"><button class="profile" onclick="openProfile()"><img class="avatar" src="${state.profile.avatar}" onerror="this.src='https://placehold.co/100x100/17354a/ffffff?text=C'"><span class="hello">Hola, <span>${esc(state.profile.name)}</span></span></button><div class="topactions"><button class="round" onclick="toast('Sin notificaciones nuevas')">♧</button><button class="round plus" onclick="openQuick()">＋</button></div></div>${calendar()}</div>`}
function calendar(){const y=calendarDate.getFullYear(),m=calendarDate.getMonth(),d=calendarDate.getDate();const names=['L','M','M','J','V','S','D'];let first=(new Date(y,m,1).getDay()+6)%7;let days=new Date(y,m+1,0).getDate();let cells=names.map(n=>`<div class="daycell">${n}</div>`).join('');for(let i=0;i<7;i++){let day=d-3+i;let cls=day===d?'active':'';let disp=day;if(day<1){disp=new Date(y,m,day).getDate();}if(day>days){disp=day-days;}cells+=`<div class="daycell ${cls}"><b>${disp}</b></div>`}return `<div class="calendar"><div class="monthrow"><button onclick="calendarDate.setMonth(calendarDate.getMonth()-1);render()">‹</button><span class="month">${todayLabel()}</span><button onclick="calendarDate.setMonth(calendarDate.getMonth()+1);render()">›</button></div><div class="week">${cells}</div></div>`}
function spark(){return `<svg viewBox="0 0 120 48" preserveAspectRatio="none"><polyline points="2,39 16,34 27,37 40,26 51,29 62,20 73,23 84,14 96,18 108,8 118,5" fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function home(){accrue();const t=totals();const delta=t.yields;const dPct=t.total?delta/t.total*100:0;return `${header()}<div class="sectiontitle"><h1>Mi patrimonio</h1><button onclick="state.settings.hide=!state.settings.hide;save();render()">${state.settings.hide?'Mostrar':'Ocultar'}⌄</button></div><div class="card hero"><div class="herohead"><div><label>Patrimonio total</label><div class="net money">${money(t.total)}</div><div class="trend">↗ +${money(delta)} · +${dPct.toFixed(1)}%</div></div><div class="spark">${spark()}</div></div><div class="breakdown"><div><div class="small muted">Ahorro</div><div class="v money">${money(t.savings)}</div><div class="tiny muted">sin rendimientos</div></div><div><div class="small muted">Rendimientos</div><div class="v money yield">+${money(t.yields)}</div><div class="tiny muted">acumulados</div></div></div></div><div class="stats"><div class="card stat"><div class="title">Disponible</div><div class="v money">${money(t.debit)}</div><div class="tiny muted">Tarjetas bancarias / débito</div></div><div class="card stat"><div class="title">Deudas</div><div class="v money">${money(t.debts)}</div><div class="tiny muted">Tarjetas de crédito</div></div></div>${goalsHome()}${savingsHome()}${cardsHome()}${expensesHome()}`}
function goalsHome(){return `<div class="sectiontitle" style="margin-top:16px"><h2>Metas</h2><button onclick="openGoalManager()">Ver todas ›</button></div><div class="list">${state.goals.slice(0,2).map(g=>goalCard(g)).join('')}</div>`}
function goalCard(g){const p=Math.min(100,g.target?g.saved/g.target*100:0);return `<div class="card goal" onclick="openGoalForm(${g.id})"><img class="goalimg" src="${esc(g.image||'https://placehold.co/160x160/17354a/ffffff?text=Meta')}"><div class="goalmain"><div class="goalname">${esc(g.name)}</div><div class="small money">${money(g.saved)} / ${money(g.target)}</div><div class="bar"><i class="green" style="width:${p}%"></i></div><div class="tiny muted">Faltan ${money(Math.max(0,g.target-g.saved))}</div></div><div class="ring" style="--p:${p}%"><b>${Math.round(p)}%</b></div></div>`}
function savingsHome(){return `<div class="sectiontitle" style="margin-top:16px"><h2>Ahorros</h2><button onclick="go('ahorros')">Ver todos ›</button></div><div class="list">${state.savings.slice(0,3).map(s=>savingCard(s,false)).join('')}</div>`}
function savingCard(s,compact){const daily=s.capital*s.rate/100/365;const monthly=daily*30;return `<div class="card mini" onclick="openSaving(${s.id})"><div class="logo" style="background:${s.color}">${s.image?`<img src="${esc(s.image)}">`:esc(s.logo||'A')}</div><div class="grow"><div class="itemtitle">${esc(s.name)}</div><div class="money" style="font-weight:800">${money(s.capital)}</div><div class="small muted">${raw(s.rate)}% anual</div></div><div class="right"><div class="yield">+${money(daily)}</div><div class="tiny muted">Hoy</div><div class="tiny muted">Mes: +${money(monthly)}</div></div></div>`}

function cardRow(c){const amount=c.kind==='debito'?c.balance:c.spent;return `<div class="card mini" onclick="openCard(${c.id})"><div class="logo" style="background:${c.color}">${c.image?`<img src="${esc(c.image)}">`:esc(c.logo||c.bank||'CARD')}</div><div class="grow"><div class="itemtitle">${esc(c.name)}</div><div class="money" style="font-weight:800">${money(amount)}</div><div class="small muted">${c.kind==='debito'?'Disponible':'Gastado'} ${c.kind==='credito'?'· Límite '+money(c.limit):''}</div></div><div>›</div></div>`}
function expensesHome(){const total=state.expenses.reduce((a,x)=>a+x.amount,0);return `<div class="sectiontitle" style="margin-top:16px"><h2>Gastos del mes</h2><button onclick="go('gastos')">Ver todos ›</button></div><div class="card item"><div class="itemhead"><strong>Gastado</strong><span class="money">${money(total)}</span></div><div class="bar"><i class="red" style="width:73%"></i></div><div class="small muted" style="margin-top:6px">Análisis por categoría</div></div>`}
function savingsPage(){return `<div class="screen"><div class="screenhead"><h1>Ahorros</h1><button class="round plus" onclick="openSavingForm()">＋</button></div><div class="list">${state.savings.map(s=>savingCard(s)).join('')}</div></div>`}
function savingDetail(s){const daily=s.capital*s.rate/100/365,monthly=daily*30,year=daily*365;return `<div class="screen"><div class="screenhead"><button class="back" onclick="selected=null;render()">‹</button><h1>${esc(s.name)}</h1><button class="round" onclick="openSavingForm(${s.id})">✎</button></div><div class="card detailHero"><div class="small muted">Capital invertido</div><div class="big money">${money(s.capital)}</div><div class="small muted">${raw(s.rate)}% anual</div><div class="detailGrid"><div class="detailBox"><div class="small muted">Hoy</div><div class="v yield">+${money(daily)}</div></div><div class="detailBox"><div class="small muted">Este mes</div><div class="v yield">+${money(monthly)}</div></div><div class="detailBox"><div class="small muted">Este año</div><div class="v yield">+${money(year)}</div></div><div class="detailBox"><div class="small muted">Acumulado</div><div class="v yield">+${money(s.yieldAccrued)}</div></div></div></div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="openYieldWithdraw(${s.id})">Retirar rendimiento</button><button class="btn secondary" onclick="openTransferSaving(${s.id})">Transferir</button></div><div class="sectiontitle" style="margin-top:15px"><h2>Historial</h2></div><div class="card item history">${(s.history||[]).slice(0,30).map(h=>`<div class="row"><span>${h.date}<br><span class="tiny muted">${raw(h.rate)}% anual</span></span><b class="positive">+${money(h.amount)}</b></div>`).join('')||'<div class="empty">Todavía no hay historial de rendimiento.</div>'}</div><div class="sectiontitle" style="margin-top:15px"><h2>Movimientos</h2></div><div class="card item">${state.movements.filter(m=>m.from===s.name||m.to===s.name).slice(0,20).map(m=>`<div class="history"><div class="row"><span>${m.date}<br>${esc(m.desc)}</span><b class="${m.type==='gasto'?'negative':'positive'}">${m.type==='gasto'?'-':'+'}${money(m.amount)}</b></div></div>`).join('')||'<div class="empty">Sin movimientos.</div>'}</div></div>`}
function cardsPage(){return `<div class="screen"><div class="screenhead"><h1>Tarjetas</h1><button class="round plus" onclick="openCardForm()">＋</button></div><div class="tabs"><button class="${sub==='debito'?'active':''}" onclick="sub='debito';render()">Bancarias</button><button class="${sub==='credito'?'active':''}" onclick="sub='credito';render()">Crédito</button></div><div class="list">${state.cards.filter(c=>c.kind===sub).map(c=>cardLarge(c)).join('')||'<div class="empty">No hay tarjetas aquí. Usa + para agregar una.</div>'}</div></div>`}
function cardLarge(c){if(c.kind==='debito')return `<div class="card item" onclick="openCard(${c.id})"><div class="itemhead"><strong>${esc(c.name)}</strong><span class="chip">${esc(c.bank)}</span></div><div style="font-size:calc(25px * var(--font-scale));font-weight:850;margin-top:9px" class="money">${money(c.balance)}</div><div class="small muted">Saldo disponible</div></div>`;const avail=Math.max(0,c.limit-c.spent),used=c.limit?c.spent/c.limit*100:0;return `<div class="card item" onclick="openCard(${c.id})"><div class="itemhead"><strong>${esc(c.name)}</strong><span class="chip">${esc(c.bank)}</span></div><div class="detailGrid"><div><div class="small muted">Gastado</div><b class="money">${money(c.spent)}</b></div><div><div class="small muted">Disponible</div><b class="money">${money(avail)}</b></div></div><div class="bar"><i class="red" style="width:${Math.min(100,used)}%"></i></div><div class="small muted" style="margin-top:8px">Corte: ${esc(c.cut)} · Pago: ${esc(c.due)}</div></div>`}
function cardDetail(c){if(c.kind==='debito')return `<div class="screen"><div class="screenhead"><button class="back" onclick="selected=null;render()">‹</button><h1>${esc(c.name)}</h1><button class="round" onclick="openCardForm(${c.id})">✎</button></div><div class="card detailHero"><div class="small muted">Saldo actual</div><div class="big money">${money(c.balance)}</div><div class="small muted">${esc(c.bank)} · Débito</div></div><div class="actions"><button class="btn primary" onclick="openBankMovement(${c.id},'sumar')">＋ Agregar dinero</button><button class="btn secondary" onclick="openBankMovement(${c.id},'restar')">− Retirar</button><button class="btn secondary" onclick="openTransferFromCard(${c.id})">⇄ Transferir</button></div><div class="sectiontitle" style="margin-top:15px"><h2>Movimientos</h2></div><div class="card item">${c.movements.length?c.movements.map(m=>`<div class="history"><div class="row"><span>${m.date}<br>${esc(m.desc)}</span><b>${m.type==='gasto'?'-':'+'}${money(m.amount)}</b></div></div>`).join(''):'<div class="empty">Sin movimientos.</div>'}</div></div>`;const avail=Math.max(0,c.limit-c.spent);return `<div class="screen"><div class="screenhead"><button class="back" onclick="selected=null;render()">‹</button><h1>${esc(c.name)}</h1><button class="round" onclick="openCardForm(${c.id})">✎</button></div><div class="card detailHero"><div class="small muted">${esc(c.bank)} · Crédito</div><div class="big money">${money(c.spent)}</div><div class="small muted">Gastado</div><div class="detailGrid"><div class="detailBox"><div class="small muted">Disponible</div><div class="v money">${money(avail)}</div></div><div class="detailBox"><div class="small muted">Límite autorizado</div><div class="v money">${money(c.limit)}</div></div></div><div class="small muted" style="margin-top:11px">Corte: ${esc(c.cut)} · Pago: ${esc(c.due)}</div></div><div class="sectiontitle" style="margin-top:15px"><h2>Compras y cargos</h2></div><div class="card item">${c.movements.length?c.movements.map(m=>`<div class="history"><div class="row"><span>${m.date}<br>${esc(m.desc)}</span><b class="negative">-${money(m.amount)}</b></div></div>`).join(''):'<div class="empty">Sin compras o cargos registrados.</div>'}</div><button class="fab" onclick="openPurchase(${c.id})">＋</button></div>`}
function gastosPage(){const total=state.expenses.reduce((a,x)=>a+x.amount,0);const max=Math.max(...state.expenses.map(x=>x.amount),1);return `<div class="screen"><div class="screenhead"><h1>Gastos</h1></div><div class="card item"><div class="small muted">En qué gasto más</div><div style="font-size:calc(28px * var(--font-scale));font-weight:850" class="money">${money(total)}</div>${state.expenses.map(x=>`<div style="margin-top:13px"><div class="itemhead"><span>${esc(x.category)}</span><b class="money">${money(x.amount)}</b></div><div class="bar"><i class="red" style="width:${x.amount/max*100}%"></i></div></div>`).join('')}</div><div class="sectiontitle" style="margin-top:15px"><h2>Ingresos</h2></div><div class="card item"><div class="row"><span>Sueldo</span><b class="positive">+${money(state.movements.filter(m=>m.type==='ingreso').reduce((a,m)=>a+m.amount,0))}</b></div><div class="row"><span>Rendimientos</span><b class="positive">+${money(totals().yields)}</b></div></div></div>`}
function movementsPage(){return `<div class="screen"><div class="screenhead"><h1>Movimientos</h1><button class="round plus" onclick="openQuick()">＋</button></div><div class="card item history">${state.movements.map(m=>`<div class="row" onclick="openMovementEdit(${m.id})"><span><b>${esc(m.desc)}</b><br><span class="tiny muted">${m.date} · ${typeLabel(m.type)}${m.from?' · '+esc(m.from):''}</span></span><b class="${['ingreso','rendimiento'].includes(m.type)?'positive':m.type==='gasto'?'negative':''}">${['ingreso','rendimiento'].includes(m.type)?'+':'-'}${money(m.amount)}</b></div>`).join('')}</div></div>`}
function typeLabel(t){return ({ingreso:'Ingreso',gasto:'Gasto',transferencia:'Transferencia',rendimiento:'Rendimiento',pago_tarjeta:'Pago de tarjeta'})[t]||t}
function setTheme(v){state.settings.theme=v;applyAppearance();save();render()}
function setFontScale(v){state.settings.fontScale=v;applyAppearance();save();render()}
function applyAppearance(){const root=document.documentElement;const theme=state.settings.theme||'system';root.dataset.theme=theme==='system'?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):theme;const fs=state.settings.fontScale||'system';let scale=1;if(fs==='small')scale=.9;else if(fs==='large')scale=1.12;else if(fs==='xlarge')scale=1.25;else if(fs==='system'){const probe=document.createElement('div');probe.style.cssText='position:absolute;left:-9999px;font-size:16px;width:1em';probe.textContent='M';document.body.appendChild(probe);const px=parseFloat(getComputedStyle(probe).fontSize)||16;probe.remove();scale=Math.min(1.35,Math.max(.9,px/16))}root.style.setProperty('--font-scale',scale);root.style.setProperty('--blue',state.settings.color||'#1787ff')}
function settingsPage(){return `<div class="screen"><div class="screenhead"><button class="back" onclick="selected=null;render()">‹</button><h1>Configuración</h1></div><div class="card settingsSection"><h3>👤 Perfil</h3><div class="settingRow"><span>Imagen</span><button class="btn secondary" onclick="openProfileEdit()">Cambiar</button></div><div class="settingRow"><span>Nombre</span><button class="btn secondary" onclick="openProfileEdit()">${esc(state.profile.name)}</button></div></div><div class="card settingsSection"><h3>🔐 Seguridad</h3><div class="settingRow"><span>Face ID / PIN</span><button class="switch on"><i></i></button></div><div class="settingRow"><span>Ocultar saldos</span><button class="switch ${state.settings.hide?'on':''}" onclick="state.settings.hide=!state.settings.hide;save();render()"><i></i></button></div><div class="settingRow"><span>Bloqueo automático</span><span class="muted">5 min</span></div></div><div class="card settingsSection"><h3>☁️ Copia de seguridad</h3><div class="settingRow"><span>Copia automática<br><small class="muted">Última copia: ${lastBackup()}</small></span><button class="switch ${state.settings.autoBackup?'on':''}" onclick="state.settings.autoBackup=!state.settings.autoBackup;save();render()"><i></i></button></div><div class="notice">Copia local automática activa. La copia en nube requiere un servicio privado conectado.</div><div class="btns" style="margin-top:10px"><button class="btn primary" onclick="backupNow()">Crear copia ahora</button><button class="btn secondary" onclick="restoreBackup()">Restaurar copia</button><button class="btn secondary" onclick="exportData()">Exportar datos</button><label class="btn secondary">Importar datos<input type="file" accept="application/json" class="hidden" onchange="importData(event)"></label></div></div><div class="card settingsSection"><h3>🎨 Apariencia</h3><div class="settingRow"><span>Tema</span><select class="chip" onchange="setTheme(this.value)"><option value="system" ${state.settings.theme==='system'?'selected':''}>Automático según el sistema</option><option value="light" ${state.settings.theme==='light'?'selected':''}>Claro</option><option value="dark" ${state.settings.theme==='dark'?'selected':''}>Oscuro</option></select></div><div class="settingRow"><span>Tamaño de fuente</span><select class="chip" onchange="setFontScale(this.value)"><option value="system" ${state.settings.fontScale==='system'?'selected':''}>Automático según iPhone</option><option value="small" ${state.settings.fontScale==='small'?'selected':''}>Pequeña</option><option value="normal" ${state.settings.fontScale==='normal'?'selected':''}>Normal</option><option value="large" ${state.settings.fontScale==='large'?'selected':''}>Grande</option><option value="xlarge" ${state.settings.fontScale==='xlarge'?'selected':''}>Muy grande</option></select></div><div class="settingRow"><span>Color principal</span><div class="colors">${['#1787ff','#1ea7e8','#18d78a','#ff9f1c','#f044c8','#7a5cff'].map(c=>`<button class="swatch ${state.settings.color===c?'sel':''}" style="background:${c}" onclick="state.settings.color='${c}';document.documentElement.style.setProperty('--blue','${c}');save();render()"></button>`).join('')}</div></div><div class="settingRow"><span>Idioma</span><span>Español ›</span></div><div class="notice">El tamaño de fuente se aplica a toda la interfaz y se adapta para evitar cortes o elementos encimados.</div></div><div class="card settingsSection"><h3>🍎 Conexiones financieras</h3><div class="settingRow"><span>Apple Wallet<br><small class="muted">Sincronización automática</small></span><span class="muted">Desactivado · Próximamente</span></div><div class="notice">La conexión permanecerá desactivada hasta contar con la integración oficial de Apple y una versión nativa compatible.</div></div><div class="card settingsSection"><h3>⚙️ Más opciones</h3><div class="settingRow"><span>Moneda</span><span>MXN - $ ›</span></div><div class="settingRow"><span>Notificaciones</span><span>Activadas ›</span></div><div class="settingRow"><span>Ayuda</span><span>›</span></div><div class="settingRow"><span>Acerca de la app</span><span>›</span></div></div></div>`}
function render(){accrue();document.documentElement.style.setProperty('--blue',state.settings.color||'#1787ff');let content='';if(selected?.kind==='saving')content=savingDetail(selected.obj);else if(selected?.kind==='card')content=cardDetail(selected.obj);else if(selected?.kind==='settings')content=settingsPage();else content=view==='inicio'?home():view==='ahorros'?savingsPage():view==='tarjetas'?cardsPage():view==='gastos'?gastosPage():movementsPage();document.getElementById('app').innerHTML=content;nav()}
function modal(html){document.getElementById('modal').innerHTML=`<div class="sheetback" onclick="if(event.target===this)closeModal()"><div class="sheet">${html}</div></div>`}
function closeModal(){document.getElementById('modal').innerHTML=''}
function openQuick(){modal(`<div class="sheettop"><h2>Nueva operación</h2><button class="close" onclick="closeModal()">×</button></div><div class="menuGrid"><button class="menuAction" onclick="closeModal();openIncome()"><div class="mi">💰</div>Ingreso</button><button class="menuAction" onclick="closeModal();openPurchase()"><div class="mi">💳</div>Gasto / Compra</button><button class="menuAction" onclick="closeModal();openTransfer()"><div class="mi">🔄</div>Transferencia</button><button class="menuAction" onclick="closeModal();openYieldManual()"><div class="mi">📈</div>Rendimiento</button><button class="menuAction" onclick="closeModal();openIncome()"><div class="mi">💵</div>Cobrar</button><button class="menuAction" onclick="closeModal();openCardPayment()"><div class="mi">💳</div>Pago de tarjeta</button></div>`)}
function openProfile(){modal(`<div class="profileMenu"><div class="profileTop"><img src="${state.profile.avatar}"><div><b>Hola, ${esc(state.profile.name)}</b><br><span class="small muted">Mi perfil</span></div></div><button onclick="closeModal();selected={kind:'settings'};render()">⚙️ Configuración</button><button onclick="closeModal();toast('Las estadísticas se muestran en Gastos y Movimientos')">▥ Mis estadísticas</button><button onclick="closeModal();openGoalManager()">🎯 Mis metas</button><button onclick="closeModal();exportData()">⇩ Exportar mis datos</button><button onclick="closeModal();backupNow()">☁️ Crear copia</button><button onclick="closeModal();state.settings.hide=!state.settings.hide;save();render()">◉ ${state.settings.hide?'Mostrar':'Ocultar'} saldos</button><button onclick="closeModal();openProfileEdit()">👤 Editar perfil</button></div>`)}
function openProfileEdit(){modal(`<div class="sheettop"><h2>Editar perfil</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>Nombre</label><input id="pn" value="${esc(state.profile.name)}"></div><div class="field"><label>Foto de perfil</label><div class="filepick"><img class="thumb" id="pthumb" src="${esc(state.profile.avatar)}"><label class="btn secondary">Elegir de Fotos<input id="paFile" type="file" accept="image/*" onchange="readImage(this,'pthumb','profile')"></label></div><div class="tiny muted">La imagen se guarda dentro de la app. No necesitas pegar enlaces.</div></div><button class="btn primary" onclick="saveProfile()">Guardar</button></div>`)}
function readImage(input,preview,target){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById(preview).src=r.result;window._pendingImage={target,data:r.result}};r.readAsDataURL(f)}
function saveProfile(){state.profile.name=document.getElementById('pn').value.trim()||'Usuario';if(window._pendingImage?.target==='profile')state.profile.avatar=window._pendingImage.data;window._pendingImage=null;save();closeModal();render()}
function openSaving(id){selected={kind:'saving',obj:state.savings.find(s=>s.id===id)};render()}
function openSavingForm(id){const s=id?state.savings.find(x=>x.id===id):{name:'',capital:0,rate:10,yieldAccrued:0,lastAccrual:new Date().toISOString().slice(0,10),limit:null,logo:'A',color:'#1787ff',history:[]};modal(`<div class="sheettop"><h2>${id?'Editar Ahorro':'Nuevo Ahorro'}</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>Nombre</label><input id="sn" value="${esc(s.name)}"></div><div class="field"><label>Capital invertido</label><input id="sc" type="number" step="0.01" value="${s.capital}"></div><div class="field"><label>Rendimiento anual %</label><input id="sr" type="number" step="0.01" value="${s.rate}"></div><div class="field"><label>Rendimiento acumulado</label><input id="sy" type="number" step="0.01" value="${s.yieldAccrued}"></div><div class="field"><label>Límite opcional</label><input id="sl" type="number" step="0.01" value="${s.limit||''}"></div><div class="field"><label>Imagen / logo</label><div class="filepick"><img class="thumb" id="sthumb" src="${s.image||'https://placehold.co/100x100/17354a/ffffff?text=Ahorro'}"><label class="btn secondary">Elegir de Fotos<input type="file" accept="image/*" onchange="readImage(this,'sthumb','saving:${id||'new'}')"></label></div><input id="so" value="${esc(s.logo||'A')}" placeholder="Texto opcional"></div><div class="btns"><button class="btn primary" onclick="saveSaving(${id||0})">Guardar</button>${id?`<button class="btn danger" onclick="deleteSaving(${id})">Borrar</button>`:''}</div></div>`)}
function saveSaving(id){const name=document.getElementById('sn').value.trim(),capital=Number(document.getElementById('sc').value),rate=Number(document.getElementById('sr').value),yieldAccrued=Number(document.getElementById('sy').value),lim=document.getElementById('sl').value,logo=document.getElementById('so').value.trim();const pending=window._pendingImage?.target||'';const image=(pending===`saving:${id||'new'}`)?window._pendingImage.data:(id?state.savings.find(x=>x.id===id)?.image:'');if(!name||capital<0||rate<0||yieldAccrued<0)return alert('Revisa los datos.');if(id){const s=state.savings.find(x=>x.id===id);Object.assign(s,{name,capital,rate,yieldAccrued,limit:lim?Number(lim):null,logo,image});s.lastAccrual=new Date().toISOString().slice(0,10)}else state.savings.push({id:Date.now(),name,capital,rate,yieldAccrued,limit:lim?Number(lim):null,logo,image,color:'#1787ff',lastAccrual:new Date().toISOString().slice(0,10),history:[]});window._pendingImage=null;save();closeModal();selected=null;render()}
function deleteSaving(id){if(confirm('¿Borrar este ahorro?')){state.savings=state.savings.filter(s=>s.id!==id);save();closeModal();selected=null;render()}}
function openYieldWithdraw(id){const s=state.savings.find(x=>x.id===id);const ds=state.cards.filter(c=>c.kind==='debito');modal(`<div class="sheettop"><h2>Retirar rendimiento</h2><button class="close" onclick="closeModal()">×</button></div><p class="small muted">El capital de ${money(s.capital)} no se modifica. El rendimiento retirado pasa a una cuenta de débito.</p><div class="form"><div class="field"><label>Rendimiento disponible</label><input value="${raw(s.yieldAccrued)}" disabled></div><div class="field"><label>Destino</label><select id="ywd">${ds.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Monto a retirar</label><input id="yw" type="number" step="0.01" value="0"></div><button class="btn primary" onclick="applyYieldWithdraw(${id})">Retirar rendimiento</button></div>`)}
function applyYieldWithdraw(id){const s=state.savings.find(x=>x.id===id),m=Number(document.getElementById('yw').value),dest=state.cards.find(c=>c.id===Number(document.getElementById('ywd').value));if(!dest)return alert('Necesitas una tarjeta de débito como destino.');if(!Number.isFinite(m)||m<=0||m>s.yieldAccrued)return alert('Monto inválido.');s.yieldAccrued-=m;dest.balance+=m;dest.movements.unshift({date:new Date().toLocaleDateString('es-MX'),desc:'Rendimiento retirado',type:'ingreso',amount:m});state.movements.unshift({id:Date.now(),date:new Date().toLocaleDateString('es-MX'),type:'transferencia',desc:'Retiro de rendimiento',amount:m,from:s.name,to:dest.name});save();closeModal();render();toast('Rendimiento retirado a débito')}
function openTransferSaving(id){openTransfer()}
function openBankMovement(id,mode){const c=state.cards.find(x=>x.id===id);modal(`<div class="sheettop"><h2>${mode==='sumar'?'Agregar dinero':'Retirar dinero'}</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>Monto</label><input id="bm" type="number" step="0.01" value="0"></div><div class="field"><label>Descripción</label><input id="bd" placeholder="Movimiento"></div><button class="btn primary" onclick="applyBank(${id},'${mode}')">Guardar</button></div>`)}
function applyBank(id,mode){const c=state.cards.find(x=>x.id===id),m=Number(document.getElementById('bm').value),d=document.getElementById('bd').value.trim()||'Movimiento';if(m<=0)return alert('Monto inválido');if(mode==='restar'&&c.balance<m)return alert('Saldo insuficiente');c.balance+=mode==='sumar'?m:-m;c.movements.unshift({date:new Date().toLocaleDateString('es-MX'),desc:d,type:mode==='sumar'?'ingreso':'gasto',amount:m});state.movements.unshift({id:Date.now(),date:new Date().toLocaleDateString('es-MX'),type:mode==='sumar'?'ingreso':'gasto',desc:d,amount:m,from:c.name});save();closeModal();render()}
function openTransferFromCard(id){openTransfer()}
function openCardForm(id){const c=id?state.cards.find(x=>x.id===id):{name:'',bank:'',kind:sub==='debito'?'debito':'credito',limit:0,spent:0,balance:0,cut:'',due:'',logo:'',color:'#1787ff',movements:[]};modal(`<div class="sheettop"><h2>${id?'Editar tarjeta':'Nueva tarjeta'}</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>Nombre</label><input id="cn" value="${esc(c.name)}"></div><div class="field"><label>Banco</label><input id="cb" value="${esc(c.bank)}"></div><div class="field"><label>Tipo</label><select id="ck"><option value="debito" ${c.kind==='debito'?'selected':''}>Bancaria / débito</option><option value="credito" ${c.kind==='credito'?'selected':''}>Crédito</option></select></div><div class="field"><label>Imagen / logo</label><div class="filepick"><img class="thumb" id="cthumb" src="${c.image||'https://placehold.co/100x100/17354a/ffffff?text=Card'}"><label class="btn secondary">Elegir de Fotos<input id="cf" type="file" accept="image/*" onchange="readImage(this,'cthumb','card:${id||'new'}')"></label></div><input id="clogo" value="${esc(c.logo||'')}" placeholder="Texto opcional"></div><div id="creditFields" class="${c.kind==='debito'?'hidden':''}"><div class="field"><label>Límite autorizado</label><input id="cl" type="number" value="${c.limit||0}"></div><div class="field"><label>Gastado</label><input id="cs" type="number" value="${c.spent||0}"></div><div class="field"><label>Fecha de corte</label><input id="ccut" value="${esc(c.cut||'')}"></div><div class="field"><label>Fecha límite de pago</label><input id="cdue" value="${esc(c.due||'')}"></div></div><div id="debitFields" class="${c.kind==='debito'?'':'hidden'}"><div class="field"><label>Saldo</label><input id="cbal" type="number" value="${c.balance||0}"></div></div><div class="btns"><button class="btn primary" onclick="saveCard(${id||0})">Guardar</button>${id?`<button class="btn danger" onclick="deleteCard(${id})">Borrar</button>`:''}</div></div>`);document.getElementById('ck').onchange=()=>{document.getElementById('creditFields').classList.toggle('hidden',document.getElementById('ck').value!=='credito');document.getElementById('debitFields').classList.toggle('hidden',document.getElementById('ck').value!=='debito')};}
function saveCard(id){const name=document.getElementById('cn').value.trim(),bank=document.getElementById('cb').value.trim(),kind=document.getElementById('ck').value,logo=document.getElementById('clogo').value.trim();const pending=window._pendingImage?.target||'';const image=(pending===`card:${id||'new'}`)?window._pendingImage.data:(id?state.cards.find(x=>x.id===id)?.image:'');if(!name)return alert('Escribe un nombre.');if(id){const c=state.cards.find(x=>x.id===id);c.name=name;c.bank=bank;c.kind=kind;c.logo=logo;c.image=image;if(kind==='credito'){c.limit=Number(document.getElementById('cl').value);c.spent=Number(document.getElementById('cs').value);c.cut=document.getElementById('ccut').value;c.due=document.getElementById('cdue').value}else c.balance=Number(document.getElementById('cbal').value)}else{const c={id:Date.now(),name,bank,kind,logo,image,color:'#1787ff',movements:[]};if(kind==='credito'){c.limit=Number(document.getElementById('cl').value);c.spent=Number(document.getElementById('cs').value);c.cut=document.getElementById('ccut').value;c.due=document.getElementById('cdue').value}else c.balance=Number(document.getElementById('cbal').value);state.cards.push(c)}window._pendingImage=null;save();closeModal();selected=null;render()}
function deleteCard(id){if(confirm('¿Borrar esta tarjeta?')){state.cards=state.cards.filter(c=>c.id!==id);save();closeModal();selected=null;render()}}
function openCard(id){selected={kind:'card',obj:state.cards.find(c=>c.id===id)};render()}
function openPurchase(cardId=null){modal(`<div class="sheettop"><h2>Gasto / Compra</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>Origen</label><select id="po">${state.cards.map(c=>`<option value="c-${c.id}" ${cardId===c.id?'selected':''}>${c.kind==='debito'?'Débito':'Crédito'} · ${esc(c.name)}</option>`).join('')}${state.savings.map(s=>`<option value="s-${s.id}">Ahorro · ${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Descripción</label><input id="pd" placeholder="Supermercado, gasolina..."></div><div class="field"><label>Monto</label><input id="pm" type="number" step="0.01" value="0"></div><div class="field"><label>Categoría</label><select id="pc"><option>Alimentos</option><option>Vivienda</option><option>Transporte</option><option>Servicios</option><option>Compras</option><option>Entretenimiento</option><option>Otros</option></select></div><button class="btn primary" onclick="applyPurchase()">Guardar compra</button></div>`)}
function applyPurchase(){const origin=document.getElementById('po').value,d=document.getElementById('pd').value.trim()||'Compra',m=Number(document.getElementById('pm').value),cat=document.getElementById('pc').value;if(m<=0)return alert('Monto inválido');let from='';if(origin.startsWith('c-')){const c=state.cards.find(x=>x.id===Number(origin.slice(2)));from=c.name;if(c.kind==='debito'){if(c.balance<m)return alert('Saldo insuficiente');c.balance-=m}else{const av=c.limit-c.spent;if(av<m)return alert('Crédito insuficiente');c.spent+=m;c.movements.unshift({date:new Date().toLocaleDateString('es-MX'),desc:d,amount:m})}}else{const s=state.savings.find(x=>x.id===Number(origin.slice(2)));from=s.name;if(s.capital<m)return alert('Capital insuficiente');s.capital-=m}state.expenses.unshift({id:Date.now(),category:cat,amount:m});state.movements.unshift({id:Date.now(),date:new Date().toLocaleDateString('es-MX'),type:'gasto',desc:d,amount:m,from,category:cat});save();closeModal();render();toast('Compra registrada')}
function openTransfer(){modal(`<div class="sheettop"><h2>Transferencia</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>De</label><select id="tf">${assetsOptions()}</select></div><div class="field"><label>A</label><select id="tt">${assetsOptions()}</select></div><div class="field"><label>Monto</label><input id="tm" type="number" step="0.01" value="0"></div><button class="btn primary" onclick="applyTransfer()">Transferir</button></div>`)}
function assetsOptions(){return state.cards.map(c=>`<option value="c-${c.id}">${c.kind==='debito'?'Débito':'Crédito'} · ${esc(c.name)}</option>`).join('')+state.savings.map(s=>`<option value="s-${s.id}">Ahorro · ${esc(s.name)}</option>`).join('')}
function asset(v){const [t,id]=v.split('-');return t==='c'?state.cards.find(c=>c.id===Number(id)):state.savings.find(s=>s.id===Number(id))}
function balance(a){return a.kind==='debito'?a.balance:a.capital}
function applyTransfer(){const f=document.getElementById('tf').value,t=document.getElementById('tt').value,m=Number(document.getElementById('tm').value);if(f===t||m<=0)return alert('Revisa los datos');const a=asset(f),b=asset(t);if(f.startsWith('c-')&&a.kind==='credito')return alert('No uses una tarjeta de crédito como origen de transferencia.');if(t.startsWith('c-')&&b.kind==='credito')return alert('Para crédito usa Pago de tarjeta.');if(balance(a)<m)return alert('Saldo insuficiente');if(a.kind==='debito')a.balance-=m;else a.capital-=m;if(b.kind==='debito')b.balance+=m;else b.capital+=m;state.movements.unshift({id:Date.now(),date:new Date().toLocaleDateString('es-MX'),type:'transferencia',desc:'Transferencia',amount:m,from:a.name,to:b.name});save();closeModal();render();toast('Transferencia realizada')}
function openIncome(){modal(`<div class="sheettop"><h2>Ingreso</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>Destino</label><select id="inacc">${state.cards.filter(c=>c.kind==='debito').map(c=>`<option value="c-${c.id}">${esc(c.name)}</option>`).join('')}${state.savings.map(s=>`<option value="s-${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Concepto</label><input id="ind" placeholder="Sueldo, bono, comisión..."></div><div class="field"><label>Monto</label><input id="inm" type="number" step="0.01" value="0"></div><button class="btn primary" onclick="applyIncome()">Guardar ingreso</button></div>`)}
function applyIncome(){const v=document.getElementById('inacc').value,m=Number(document.getElementById('inm').value),d=document.getElementById('ind').value.trim()||'Ingreso';if(m<=0)return alert('Monto inválido');const a=asset(v);if(a.kind==='debito')a.balance+=m;else a.capital+=m;state.movements.unshift({id:Date.now(),date:new Date().toLocaleDateString('es-MX'),type:'ingreso',desc:d,amount:m,to:a.name});save();closeModal();render();toast('Ingreso registrado')}
function openYieldManual(){modal(`<div class="sheettop"><h2>Registrar rendimiento</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>Ahorro</label><select id="yri">${state.savings.map(s=>`<option value="${s.id}">${esc(s.name)} · ${money(s.capital)}</option>`).join('')}</select></div><div class="field"><label>Monto del rendimiento</label><input id="yrm" type="number" step="0.01" value="0"></div><button class="btn primary" onclick="applyYieldManual()">Registrar rendimiento</button></div>`)}
function applyYieldManual(){const s=state.savings.find(x=>x.id===Number(document.getElementById('yri').value)),m=Number(document.getElementById('yrm').value);if(!s||!Number.isFinite(m)||m<=0)return alert('Monto inválido');s.yieldAccrued+=m;s.history=s.history||[];s.history.unshift({date:new Date().toISOString().slice(0,10),amount:m,rate:s.rate});state.movements.unshift({id:Date.now(),date:new Date().toLocaleDateString('es-MX'),type:'rendimiento',desc:'Rendimiento registrado',amount:m,to:s.name,savingId:s.id});save();closeModal();render();toast('Rendimiento registrado')}
function openCardPayment(){const cs=state.cards.filter(c=>c.kind==='credito');modal(`<div class="sheettop"><h2>Pago de tarjeta</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>Tarjeta</label><select id="pcard">${cs.map(c=>`<option value="${c.id}">${esc(c.name)} · deuda ${money(c.spent)}</option>`).join('')}</select></div><div class="field"><label>Cuenta de débito</label><select id="pbank">${state.cards.filter(c=>c.kind==='debito').map(c=>`<option value="${c.id}">${esc(c.name)} · ${money(c.balance)}</option>`).join('')}</select></div><div class="field"><label>Monto</label><input id="pamt" type="number" step="0.01" value="0"></div><button class="btn primary" onclick="applyCardPayment()">Pagar</button></div>`)}
function applyCardPayment(){const c=state.cards.find(x=>x.id===Number(document.getElementById('pcard').value)),b=state.cards.find(x=>x.id===Number(document.getElementById('pbank').value)),m=Number(document.getElementById('pamt').value);if(!c||!b||m<=0||m>c.spent||m>b.balance)return alert('Revisa monto y saldos');c.spent-=m;b.balance-=m;c.movements.unshift({date:new Date().toLocaleDateString('es-MX'),desc:'Pago de tarjeta',amount:m});state.movements.unshift({id:Date.now(),date:new Date().toLocaleDateString('es-MX'),type:'pago_tarjeta',desc:'Pago de tarjeta',amount:m,from:b.name,to:c.name});save();closeModal();render();toast('Pago aplicado sin duplicar el gasto')}
function openGoalManager(){modal(`<div class="sheettop"><h2>Metas</h2><button class="close" onclick="closeModal()">×</button></div>${state.goals.map(goalCard).join('')}<button class="btn primary" style="width:100%;margin-top:10px" onclick="openGoalForm()">＋ Crear meta</button>`)}
function openGoalForm(id){const g=id?state.goals.find(x=>x.id===id):{name:'',target:0,saved:0,image:''};modal(`<div class="sheettop"><h2>${id?'Editar meta':'Nueva meta'}</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>Nombre</label><input id="gn" value="${esc(g.name)}"></div><div class="field"><label>Objetivo</label><input id="gt" type="number" value="${g.target}"></div><div class="field"><label>Ahorrado</label><input id="gs" type="number" value="${g.saved}"></div><div class="field"><label>Imagen</label><div class="filepick"><img class="thumb" id="gthumb" src="${esc(g.image||'https://placehold.co/100x100/17354a/ffffff?text=Meta')}"><label class="btn secondary">Elegir de Fotos<input type="file" accept="image/*" onchange="readImage(this,'gthumb','goal:${id||'new'}')"></label></div></div><div class="btns"><button class="btn primary" onclick="saveGoal(${id||0})">Guardar</button>${id?`<button class="btn danger" onclick="deleteGoal(${id})">Borrar</button>`:''}</div></div>`)}
function saveGoal(id){const name=document.getElementById('gn').value.trim(),target=Number(document.getElementById('gt').value),saved=Number(document.getElementById('gs').value);if(!name||target<=0||saved<0)return alert('Revisa los datos');const pending=window._pendingImage?.target||'';let image=id?state.goals.find(g=>g.id===id)?.image:'';if(pending===`goal:${id||'new'}`)image=window._pendingImage.data;if(id)Object.assign(state.goals.find(g=>g.id===id),{name,target,saved,image});else state.goals.push({id:Date.now(),name,target,saved,image});window._pendingImage=null;save();closeModal();render()}
function deleteGoal(id){if(confirm('¿Borrar meta?')){state.goals=state.goals.filter(g=>g.id!==id);save();closeModal();render()}}
function openMovementEdit(id){const m=state.movements.find(x=>x.id===id);modal(`<div class="sheettop"><h2>Editar movimiento</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>Descripción</label><input id="md" value="${esc(m.desc)}"></div><div class="field"><label>Monto</label><input id="mm" type="number" value="${m.amount}"></div><button class="btn primary" onclick="saveMovement(${id})">Guardar</button><button class="btn danger" onclick="deleteMovement(${id})">Eliminar movimiento</button></div>`)}
function saveMovement(id){const m=state.movements.find(x=>x.id===id);m.desc=document.getElementById('md').value.trim()||m.desc;m.amount=Number(document.getElementById('mm').value)||m.amount;save();closeModal();render()}
function deleteMovement(id){state.movements=state.movements.filter(x=>x.id!==id);save();closeModal();render()}
function lastBackup(){const b=JSON.parse(localStorage.getItem(KEY+'-backup')||'null');return b?new Date(b.savedAt).toLocaleString('es-MX'):'Nunca'}
function backupNow(){localStorage.setItem(KEY+'-backup',JSON.stringify({version:2,savedAt:new Date().toISOString(),state}));toast('Copia local creada')}
function restoreBackup(){const b=JSON.parse(localStorage.getItem(KEY+'-backup')||'null');if(!b)return alert('No hay una copia disponible.');if(confirm('Restaurar la última copia local?')){state=b.state;save();selected=null;render();toast('Copia restaurada')}}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='finanzas-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.savings||!x.cards)throw 0;state=x;save();render();toast('Datos importados')}catch{alert('Archivo no válido')}};r.readAsText(f)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
applyAppearance();
render();
if(window.matchMedia){window.matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{if((state.settings.theme||'system')==='system'){applyAppearance();render()}})}
</script>
</body></html>
